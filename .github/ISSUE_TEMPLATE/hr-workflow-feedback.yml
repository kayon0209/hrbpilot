name: HR workflow feedback
description: Share a real HR workflow or governance requirement that HRBPilot should support.
title: "[HR workflow] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping shape HRBPilot. Please describe a workflow, not personal or employee data.
        Do not include names, contact details, policy documents with restricted content, tokens, or screenshots containing sensitive information.
  - type: dropdown
    id: perspective
    attributes:
      label: Your perspective
      options:
        - HR practitioner
        - HR operations / shared service
        - HRBP / people manager
        - Security / compliance
        - AI or platform engineer
        - Other
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow to improve
      description: Describe the trigger, the human decision, and the intended outcome using anonymized examples.
      placeholder: "Example: An employee raises a payroll concern; HR needs evidence before deciding whether to create a case."
    validations:
      required: true
  - type: textarea
    id: current_pain
    attributes:
      label: What is difficult today?
      description: Include the handoffs, repeated work, risk, or failure mode that matters most.
    validations:
      required: true
  - type: textarea
    id: guardrail
    attributes:
      label: Required guardrails
      description: What must a human approve? What evidence, access control, audit trail, or recovery behavior is required?
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Intended deployment
      options:
        - Personal local machine
        - Team internal environment
        - Not sure yet
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, credentials, and restricted company information from this issue.
          required: true
