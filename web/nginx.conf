server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 裸 `/mcp` 归协议客户端（MCP 客户端常把资源地址填成不带尾斜杠的形式）。
  # 界面页已经迁到 `/assistant` —— 之前两者同名，导致浏览器刷新/直达本页时被这条
  # 307 抢走并落到后端，返回 401 JSON。
  #
  # Location 必须用 `$http_host`（请求头原始值，含端口）而不是让 nginx 用 `$host`
  # 生成绝对重定向：容器内 listen 80，nginx 认为端口就是默认的 80 因而省略，于是
  # 客户端被引到 `http://<host>/mcp/`（丢掉 `3001` 这类映射端口）而连不上。
  location = /mcp { return 307 $scheme://$http_host/mcp/; }
  location /mcp/ {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Accept $http_accept;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /api/ {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
