[project]
name = "hrbp-ai-workbench"
version = "0.1.0"
description = "HRBP AI Workbench - unified AI platform for 5 HR scenarios"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0,<5.0",
    "python-multipart>=0.0.18",
    "redis[hiredis]>=5.2.0,<6.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "pymilvus>=2.5.0,<3.0",
    "python-docx>=1.1.0",
    "pypdf>=5.1.0",
    "jieba>=0.42.1",
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "E501", "UP042", "UP047", "SIM102", "SIM105", "SIM108", "SIM110"]  # Chinese text; str-Enum and simplify suggestions are stylistic

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: requires live PostgreSQL and Milvus services",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# NOT using strict=true — the codebase is partially annotated.  We enable the
# checks that catch real type-level bugs and leave pure annotation-discipline
# checks (disallow_untyped_defs, disallow_any_generics) off until the remaining
# functions are fully annotated.
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pymilvus.*", "minio.*", "jieba.*", "jose.*", "passlib.*"]
ignore_missing_imports = true
