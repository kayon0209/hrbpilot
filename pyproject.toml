[project]
name = "hrbp-ai-workbench"
version = "0.1.0"
description = "HRBP AI Workbench - unified AI platform for 5 HR scenarios"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "pymilvus>=2.5.0",
    "python-docx>=1.1.0",
    "pypdf>=5.1.0",
    "hdbscan>=0.8.33",
    "sentence-transformers>=3.3.0",
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["milvus.*", "minio.*", "celery.*", "hdbscan.*", "sentence_transformers.*"]
ignore_missing_imports = true
