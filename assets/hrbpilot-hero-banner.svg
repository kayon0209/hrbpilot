<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">HRBPilot：可信 HR Agent</title>
  <desc id="desc">一位 HR 负责人核对证据卡片，旁边的 AI 整理企业知识；图中标出 HRBPilot 的三项能力：制度问答有依据、敏感输入先防护、涉及行动必须人工审批并可追溯。</desc>
  <defs>
    <linearGradient id="topShade" x1="0" y1="0" x2=".65" y2="1">
      <stop stop-color="#082443" stop-opacity=".93"/>
      <stop offset=".56" stop-color="#123d67" stop-opacity=".48"/>
      <stop offset="1" stop-color="#123d67" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#081f38" stop-opacity=".94"/>
      <stop offset=".72" stop-color="#102f4f" stop-opacity=".42"/>
      <stop offset="1" stop-color="#102f4f" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06182d" flood-opacity=".24"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #a7f3d0; }
      .headline { font-size: 52px; font-weight: 800; fill: #ffffff; }
      .subhead { font-size: 23px; font-weight: 500; fill: #dbeafe; }
      .cardTitle { font-size: 17px; font-weight: 750; fill: #ffffff; }
      .cardCopy { font-size: 14px; fill: #dbeafe; }
      .foot { font-size: 15px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>
  <image href="hrbpilot-hero.png" x="0" y="0" width="1672" height="941" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1672" height="941" fill="url(#topShade)"/>
  <rect width="1672" height="941" fill="url(#bottomShade)"/>

  <g class="sans">
    <rect x="82" y="72" width="210" height="38" rx="19" fill="#0f766e" fill-opacity=".86"/>
    <text x="187" y="98" text-anchor="middle" class="eyebrow">企业 HR 智能体</text>
    <text x="82" y="180" class="headline">HRBPilot</text>
    <text x="82" y="222" class="subhead">让每一次 HR 决策，都有证据可查、有边界可守、有人负责。</text>
    <text x="82" y="259" class="subhead" font-size="18">AI 负责整理与检索；判断、审批与责任始终由人保留。</text>

    <g filter="url(#shadow)">
      <rect x="82" y="654" width="456" height="166" rx="20" fill="#155e75" fill-opacity=".92"/>
      <circle cx="124" cy="701" r="21" fill="#67e8f9"/>
      <path d="M115 701 l7 7 l14 -17" fill="none" stroke="#083344" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="705" class="cardTitle">制度问答 · 有证据才回答</text>
      <text x="106" y="745" class="cardCopy">原问题与改写问题双路检索，答案附来源与页码。</text>
      <text x="106" y="775" class="cardCopy">证据不足就明确说明，不假装知道。</text>

      <rect x="608" y="654" width="456" height="166" rx="20" fill="#1d4e89" fill-opacity=".92"/>
      <circle cx="650" cy="701" r="21" fill="#bfdbfe"/>
      <path d="M650 686 l13 6 v10 c0 10 -5 18 -13 22 c-8 -4 -13 -12 -13 -22 v-10 z" fill="#1e3a8a"/>
      <text x="686" y="705" class="cardTitle">敏感输入 · 先防护再进模型</text>
      <text x="632" y="745" class="cardCopy">注入检测、PII 脱敏与不可信证据边界贯穿流程。</text>
      <text x="632" y="775" class="cardCopy">日志保留必要信号，不记录问题原文。</text>

      <rect x="1134" y="654" width="456" height="166" rx="20" fill="#9a5b12" fill-opacity=".92"/>
      <circle cx="1176" cy="701" r="21" fill="#fde68a"/>
      <path d="M1165 702 l8 8 l16 -18" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1212" y="705" class="cardTitle">涉及行动 · 人工审批并可追溯</text>
      <text x="1158" y="745" class="cardCopy">审批后才由独立 Worker 执行；异常进入 DLQ 对账。</text>
      <text x="1158" y="775" class="cardCopy">每次操作保留审计轨迹，也支持恢复演练。</text>
    </g>
    <text x="82" y="875" class="foot">证据优先 · 多租户隔离 · 受控执行 · 可观测、可恢复</text>
  </g>
</svg>
