<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif">
  <title id="title">HRBPilot 产品特色总览</title>
  <desc id="desc">三项面向 HR 的产品特色：基于企业制度提供带来源的回答，协助完成日常 HR 工作，以及涉及行动时必须由人审批并保留记录。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f4f7ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1440" height="820" rx="32" fill="url(#background)"/>
  <rect x="1" y="1" width="1438" height="818" rx="31" fill="none" stroke="#dbeafe" stroke-width="2"/>

  <rect x="70" y="58" width="1300" height="124" rx="28" fill="url(#blue)"/>
  <circle cx="129" cy="120" r="30" fill="#ffffff" fill-opacity=".18"/>
  <path d="M117 108h24v15c0 15-12 21-12 21s-12-6-12-21z" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M122 123l5 5 10-11" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="111" font-size="34" font-weight="750" fill="#ffffff">HRBPilot：让 HR 工作更有依据，也更可控</text>
  <text x="180" y="148" font-size="19" fill="#dbeafe">不是替代 HR 决策，而是把信息整理、制度取证与执行留痕交给系统</text>

  <!-- card 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="238" width="400" height="414" rx="28" fill="#ffffff"/>
  </g>
  <rect x="100" y="270" width="112" height="44" rx="22" fill="#dbeafe"/>
  <text x="156" y="299" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">制度问答</text>
  <circle cx="390" cy="319" r="52" fill="#eff6ff"/>
  <path d="M363 293h39a10 10 0 0 1 10 10v25a10 10 0 0 1-10 10h-18l-13 12v-12h-8a10 10 0 0 1-10-10v-25a10 10 0 0 1 10-10z" fill="#2563eb"/>
  <path d="M374 310h18M374 320h13" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="370" font-size="27" font-weight="750" fill="#0f172a">问制度，不只得到答案</text>
  <text x="100" y="407" font-size="18" fill="#334155">从企业现有制度和知识库中找依据，</text>
  <text x="100" y="435" font-size="18" fill="#334155">回答附带来源，方便 HR 核对。</text>
  <rect x="100" y="480" width="340" height="104" rx="16" fill="#eff6ff"/>
  <circle cx="130" cy="516" r="10" fill="#2563eb"/>
  <text x="153" y="522" font-size="16" font-weight="700" fill="#1e40af">有来源，才给建议</text>
  <circle cx="130" cy="555" r="10" fill="#2563eb"/>
  <text x="153" y="561" font-size="16" font-weight="700" fill="#1e40af">没有足够依据，就明确说明</text>

  <!-- card 2 -->
  <g filter="url(#shadow)">
    <rect x="520" y="238" width="400" height="414" rx="28" fill="#ffffff"/>
  </g>
  <rect x="550" y="270" width="138" height="44" rx="22" fill="#dcfce7"/>
  <text x="619" y="299" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">日常工作助手</text>
  <circle cx="840" cy="319" r="52" fill="#ecfdf5"/>
  <rect x="811" y="290" width="40" height="52" rx="6" fill="#10b981"/>
  <path d="M820 305h21M820 316h21M820 327h13" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M859 301l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#f59e0b"/>
  <text x="550" y="370" font-size="27" font-weight="750" fill="#0f172a">重复整理，交给系统做</text>
  <text x="550" y="407" font-size="18" fill="#334155">把 HR 日常需要整理、归纳和生成的</text>
  <text x="550" y="435" font-size="18" fill="#334155">信息先处理好，人保留专业判断。</text>
  <rect x="550" y="480" width="340" height="104" rx="16" fill="#ecfdf5"/>
  <text x="574" y="520" font-size="16" font-weight="700" fill="#047857">面谈纪要 · 员工声音</text>
  <text x="574" y="554" font-size="16" font-weight="700" fill="#047857">HR 周报 · 文化内容</text>

  <!-- card 3 -->
  <g filter="url(#shadow)">
    <rect x="970" y="238" width="400" height="414" rx="28" fill="#ffffff"/>
  </g>
  <rect x="1000" y="270" width="138" height="44" rx="22" fill="#fef3c7"/>
  <text x="1069" y="299" text-anchor="middle" font-size="16" font-weight="700" fill="#a16207">受控协作</text>
  <circle cx="1290" cy="319" r="52" fill="#fff7ed"/>
  <path d="M1263 299h54v39a10 10 0 0 1-10 10h-34a10 10 0 0 1-10-10z" fill="#f59e0b"/>
  <path d="M1276 320l9 9 18-20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1000" y="370" font-size="27" font-weight="750" fill="#0f172a">需要行动，由人来拍板</text>
  <text x="1000" y="407" font-size="18" fill="#334155">建单、指派、状态更新等操作，</text>
  <text x="1000" y="435" font-size="18" fill="#334155">必须经过负责人明确审批。</text>
  <rect x="1000" y="480" width="340" height="104" rx="16" fill="#fff7ed"/>
  <circle cx="1030" cy="516" r="10" fill="#d97706"/>
  <text x="1053" y="522" font-size="16" font-weight="700" fill="#92400e">审批后才执行，不替人做决定</text>
  <circle cx="1030" cy="555" r="10" fill="#d97706"/>
  <text x="1053" y="561" font-size="16" font-weight="700" fill="#92400e">执行、通知和结果都可追溯</text>

  <!-- closing statement -->
  <rect x="70" y="700" width="1300" height="66" rx="20" fill="#0f172a"/>
  <circle cx="110" cy="733" r="11" fill="#60a5fa"/>
  <text x="137" y="740" font-size="18" font-weight="700" fill="#ffffff">有依据</text>
  <circle cx="294" cy="733" r="11" fill="#34d399"/>
  <text x="321" y="740" font-size="18" font-weight="700" fill="#ffffff">省时间</text>
  <circle cx="478" cy="733" r="11" fill="#fbbf24"/>
  <text x="505" y="740" font-size="18" font-weight="700" fill="#ffffff">人负责</text>
  <line x1="675" y1="718" x2="675" y2="748" stroke="#334155" stroke-width="2"/>
  <text x="706" y="740" font-size="18" font-weight="600" fill="#e2e8f0">帮助 HR 更快做出有依据、可落实的决定</text>
</svg>
