# HRBP AI Workbench — Docker Compose production-like stack
# FastAPI + PostgreSQL + Redis + MinIO + Milvus + React (Nginx)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# Environment: copy backend/env.docker to backend/.env and edit before starting.

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrbp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrbp_password}
      POSTGRES_DB: hrbp_workbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrbp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO (S3-compatible object storage) ---
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Milvus (vector database) ---
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - milvus_etcd:/etcd

  milvus-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: milvus
      MINIO_ROOT_PASSWORD: milvus123
    volumes:
      - milvus_minio_data:/data

  milvus:
    image: milvusdb/milvus:v2.4.0
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"   # gRPC API
      - "9091:9091"     # Metrics
    depends_on:
      - milvus-etcd
      - milvus-minio
    volumes:
      - milvus_data:/var/lib/milvus

  # --- FastAPI backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/env.docker
    environment:
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      VECTOR_DB_HOST: milvus
      MINIO_ENDPOINT: minio:9000
      # Override connection strings for container networking
      DATABASE_URL: postgresql+asyncpg://hrbp:${POSTGRES_PASSWORD:-hrbp_password}@postgres:5432/hrbp_workbench
      REDIS_URL: redis://redis:6379/0
      VECTOR_DB_PORT: 19530
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # No volume mount in production — use image-built code
    # Dev: uncomment to enable hot-reload:
    # volumes:
    #   - ./backend:/app

  # --- React frontend (Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Start after backend is healthy
    # Nginx serves static SPA + proxies /api/* to backend:8000

volumes:
  postgres_data:
  redis_data:
  minio_data:
  milvus_etcd:
  milvus_minio_data:
  milvus_data:
