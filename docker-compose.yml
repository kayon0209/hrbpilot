services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: docker.1ms.run/minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: docker.1ms.run/milvusdb/milvus:v2.5.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19531:19530"
      - "9092:9091"
    depends_on:
      - etcd
      - minio

  postgres:
    image: docker.1ms.run/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
      POSTGRES_DB: hrbp_workbench
    ports:
      # Host 5432 is occupied by a local Windows PostgreSQL service; publish
      # the container on 5433 so both can coexist. Point DATABASE_URL at it.
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-application-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrbp_workbench"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      target: runtime
    user: "10001:10001"
    env_file: env.docker
    environment:
      # 必须是**用户实际访问的对外 origin**（本机是 nginx 入口 :3001，浏览器也从这里进）。
      # 它决定 401 挑战里广播的 resource_metadata 与 token audience（RFC 8707）——
      # 写成内部端口（如 8001）会让助手侧的自动发现拿一个连不上的地址，且错误只出现在助手侧。
      # 正式部署时改成 https 域名，两处 PUBLIC_BASE_URL 必须一致。
      PUBLIC_BASE_URL: http://localhost:3001
      MCP_AUTHORIZATION_SERVERS: http://localhost:8002
      OAUTH_ISSUER: http://localhost:8002
      OAUTH_INTERNAL_BASE_URL: http://oauth-as:8000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8001:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  oauth-as:
    build:
      context: .
      target: runtime
    user: "10001:10001"
    env_file: env.docker
    environment:
      # 与 app 服务保持一致：AS 签发的 access token 以 <PUBLIC_BASE_URL>/mcp 为 audience，
      # RS（app）按自己的同一配置校验 —— 两边不一致时令牌会被 RS 拒收。
      PUBLIC_BASE_URL: http://localhost:3001
      MCP_AUTHORIZATION_SERVERS: http://localhost:8002
      OAUTH_ISSUER: http://localhost:8002
      OAUTH_ENABLE_DYNAMIC_REGISTRATION: "true"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8002:8000"
    command: ["uvicorn", "app.oauth.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      target: runtime
    user: "10001:10001"
    env_file: env.docker
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_started
      redis:
        condition: service_started
    command: ["python", "-m", "app.outbox.worker", "--poll-interval", "2", "--max-messages", "100"]

  # Celery worker for async jobs. Queue isolation (batch C): ingestion and
  # scenario tasks run in separate queues; this worker consumes both with
  # prefetch=1 so one heavy document rebuild cannot starve scenario batches.
  # Scale independently: docker compose up --scale celery-worker=2
  celery-worker:
    build:
      context: .
      target: runtime
    user: "10001:10001"
    env_file: env.docker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_started
      redis:
        condition: service_started
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "app.shared.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "-Q",
        "kb_ingest,scenario",
      ]

  test:
    build:
      context: .
      target: test
    env_file: env.docker
    profiles: ["test"]
    command: ["pytest"]

  web:
    build:
      context: ./web
    depends_on:
      app:
        condition: service_started
    ports:
      - "3001:80"

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  pg_data:
